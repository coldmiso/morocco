<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="theme-color" content="#F1E6D2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Marrakech · Nov 19–23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&display=swap">
<style>
/* ============================================================
   DESIGN TOKENS — every color, font family and font size on the
   main site lives here. Restyle by editing these, not the rules.
   Colors are "R,G,B" triplets so tints follow automatically:
   use rgb(var(--accent)) or rgba(var(--accent),.3).
   ============================================================ */
:root{
  color-scheme:light;

  /* --- palette: paper + indigo ink, lantern gold, blush coral --- */
  --bg:241,230,210;         /* #F1E6D2  paper: page background, tab bar */
  --surface:248,242,230;    /* #F8F2E6  lighter paper: hero, cards, events */
  --text:35,32,74;          /* #23204A  indigo ink: headings, main text */
  --text-soft:62,58,96;     /* #3E3A60  paragraph text */
  --muted:101,93,112;       /* #655D70  secondary text */
  --line:35,32,74;          /* #23204A  borders & hairlines (used at low alpha) */
  --accent:232,180,74;      /* #E8B44A  lantern gold fills: active day, dots, rules */
  --accent-text:138,90,12;  /* #8A5A0C  gold for text on paper (readable) */
  --on-accent:35,32,74;     /* #23204A  text on gold fills */
  --accent-2:240,137,126;   /* #F0897E  blush coral: night events */
  --scrim:42,26,18;         /* #2A1A12  warm umber shade over photos */
  --on-photo:248,242,230;   /* #F8F2E6  text over photos */

  /* --- Black & Gold card (matches /themes/black-gold/) --- */
  --bg-ink:11,10,8;         /* #0B0A08 */
  --bg-ink-2:20,17,11;      /* #14110B  stripe */
  --bg-gold:201,162,74;     /* #C9A24A  gold leaf */
  --bg-paper:243,231,201;   /* #F3E7C9 */

  /* --- fonts --- */
  --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-display:"Gloock","Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --font-display-weight:400;  /* Gloock has one weight, no italic; never fake them */

  /* --- type scale --- */
  --fs-tag:10px;        /* "To confirm" tags */
  --fs-tab:10.5px;      /* tab bar labels (phone) */
  --fs-label:11px;      /* eyebrows, fact labels, card dates */
  --fs-time:12px;       /* timeline times */
  --fs-note:13px;       /* notes, descriptions, dates, countdown, day pills */
  --fs-small:14px;      /* .small footers, tab bar labels (desktop) */
  --fs-ui:15px;         /* fact values, link titles, day pill names */
  --fs-body:16px;       /* body copy, event titles */
  --fs-card:18px;       /* theme card titles, link arrows */
  --fs-section:22px;    /* section titles, Black & Gold card title */
  --fs-hero-sub:26px;   /* "Lucy's 30th" */
  --fs-hero:38px;       /* "Moroccan Nights" */

  /* --- layout --- */
  --bar-h:62px;
  --radius:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:rgb(var(--bg));
  color:rgb(var(--text));
  font-family:var(--font-body);
  font-size:var(--fs-body);line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
a{color:inherit;text-decoration:none}

/* ---------- layout shell ---------- */
.wrap{
  max-width:640px;margin:0 auto;
  padding:0 20px calc(var(--bar-h) + 28px + env(safe-area-inset-bottom));
}
.panel{display:none;animation:fade .18s ease-out}
.panel.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

h1,h2,h3{font-family:var(--font-display);font-weight:var(--font-display-weight);font-synthesis:none;margin:0}
.eyebrow{
  font-size:var(--fs-label);letter-spacing:.18em;text-transform:uppercase;
  color:rgb(var(--accent-text));font-weight:600;margin:0 0 10px
}
.section-title{font-size:var(--fs-section);margin:30px 0 14px}
p{margin:0 0 14px;color:rgb(var(--text-soft))}
.small{font-size:var(--fs-small);color:rgb(var(--muted))}

/* ---------- home ---------- */
.hero{
  margin:22px 0 26px;padding:34px 22px 28px;border-radius:22px;text-align:center;
  background:
    radial-gradient(120% 90% at 50% 0%, rgba(var(--accent),.22), transparent 62%),
    radial-gradient(90% 70% at 50% 110%, rgba(var(--accent-2),.20), transparent 60%),
    rgb(var(--surface));
  border:1px solid rgba(var(--accent),.55);
}
.hero .mark{width:34px;height:1px;background:rgb(var(--accent-text));margin:0 auto 18px;opacity:.8}
.hero h1{font-size:var(--fs-hero);line-height:1.05;letter-spacing:-.01em}
.hero h1 em{font-style:italic;color:rgb(var(--accent-text));display:block;font-size:var(--fs-hero-sub);margin-top:6px}
.hero .dates{
  margin-top:16px;font-size:var(--fs-note);letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--text))
}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(var(--accent-text),.5),transparent);margin:18px 0}
.countdown{font-size:var(--fs-note);color:rgb(var(--accent-text));letter-spacing:.1em;text-transform:uppercase}

.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 6px}
.fact{background:rgb(var(--surface));border:1px solid rgba(var(--line),.10);border-radius:var(--radius);padding:14px}
.fact .k{font-size:var(--fs-label);letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--muted))}
.fact .v{font-size:var(--fs-ui);margin-top:4px}

/* ---------- theme nights ---------- */
.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.theme{
  position:relative;overflow:hidden;aspect-ratio:3/4;border-radius:var(--radius);
  display:flex;flex-direction:column;justify-content:flex-end;padding:14px;
  background:rgb(var(--surface));border:1px solid rgba(var(--line),.12)
}
.theme:active{opacity:.85}
.theme img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.theme.photo{color:rgb(var(--on-photo))}
.theme.photo:before{content:"";position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,rgba(var(--scrim),0) 30%,rgba(var(--scrim),.95) 78%)}
.theme .in{position:relative;z-index:2}
.theme .k{font-size:var(--fs-label);letter-spacing:.14em;text-transform:uppercase;color:rgb(var(--accent-text));font-weight:600}
.theme.photo .k{color:rgb(var(--accent))}
.theme h3{font-size:var(--fs-card);line-height:1.15;margin-top:4px}
.theme .d{font-size:var(--fs-note);color:rgb(var(--muted));margin-top:6px}
.theme.photo .d{color:rgba(var(--on-photo),.8)}
.theme.bg{
  justify-content:center;text-align:center;color:rgb(var(--bg-gold));border-color:rgba(var(--bg-gold),.45);
  background:repeating-linear-gradient(90deg,rgb(var(--bg-ink)) 0 24px,rgb(var(--bg-ink-2)) 24px 48px)
}
.theme.bg .k{color:rgb(var(--bg-gold))}
.theme.bg h3{font-size:var(--fs-section);line-height:1.1;margin-top:12px}
.theme.bg h3:before{content:"";display:block;width:28px;height:1px;background:rgb(var(--bg-gold));margin:0 auto 12px;opacity:.8}
.theme.bg .d{color:rgb(var(--bg-paper));opacity:.75;margin-top:12px}

/* ---------- schedule ---------- */
.days{
  display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px;margin:0 -20px;
  padding-left:20px;padding-right:20px;scrollbar-width:none;
  position:sticky;top:0;z-index:5;background:rgb(var(--bg));
}
.days::-webkit-scrollbar{display:none}
.day-btn{
  flex:0 0 auto;border:1px solid rgba(var(--line),.2);background:transparent;color:rgb(var(--text));
  font:inherit;font-size:var(--fs-note);padding:9px 15px;border-radius:999px;cursor:pointer;white-space:nowrap
}
.day-btn b{display:block;font-family:var(--font-display);font-size:var(--fs-ui);font-weight:var(--font-display-weight);font-synthesis:none}
.day-btn.on{background:rgb(var(--accent));color:rgb(var(--on-accent));border-color:rgb(var(--accent))}

.tl{position:relative;padding-left:74px;margin-top:6px}
.tl:before{content:"";position:absolute;left:66px;top:6px;bottom:6px;width:1px;background:rgba(var(--line),.18)}
.ev{position:relative;padding:12px 14px;margin-bottom:10px;border-radius:14px;
  background:rgb(var(--surface));border:1px solid rgba(var(--line),.10)}
.ev .time{position:absolute;left:-74px;top:14px;width:58px;text-align:right;
  font-size:var(--fs-time);color:rgb(var(--muted));font-variant-numeric:tabular-nums}
.ev:after{content:"";position:absolute;left:-12px;top:19px;width:9px;height:9px;border-radius:50%;
  background:rgb(var(--bg));border:2px solid rgb(var(--accent))}
.ev h3{font-size:var(--fs-body)}
.ev .note{font-size:var(--fs-note);color:rgb(var(--muted));margin-top:3px}
.ev.night{background:linear-gradient(135deg,rgba(var(--accent-2),.22),rgba(var(--accent),.14)),rgb(var(--surface));
  border-color:rgba(var(--accent-2),.6)}
.ev.night:after{background:rgb(var(--accent-2));border-color:rgb(var(--accent-2))}
.ev.tent{border-style:dashed;opacity:.85}
.tag{display:inline-block;font-size:var(--fs-tag);letter-spacing:.12em;text-transform:uppercase;
  color:rgb(var(--accent-text));border:1px solid rgba(var(--accent-text),.45);border-radius:999px;padding:2px 8px;margin-bottom:6px}

/* ---------- links ---------- */
.link{
  display:flex;align-items:center;gap:14px;padding:15px 16px;margin-bottom:10px;
  background:rgb(var(--surface));border:1px solid rgba(var(--line),.10);border-radius:var(--radius)
}
.link:active{background:rgba(var(--line),.06)}
.link .num{font-family:var(--font-display);font-size:var(--fs-note);color:rgb(var(--accent-text));
  width:20px;flex:0 0 auto;letter-spacing:.04em;padding-top:1px}
.link .t{font-size:var(--fs-ui);font-weight:600}
.link .d{font-size:var(--fs-note);color:rgb(var(--muted))}
.link .ar{margin-left:auto;color:rgb(var(--muted));font-size:var(--fs-card)}

/* ---------- tab bar ---------- */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;background:rgba(var(--bg),.92);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid rgba(var(--line),.12);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1;background:none;border:0;color:rgb(var(--muted));font:inherit;font-size:var(--fs-tab);
  letter-spacing:.04em;padding:9px 0 7px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;height:var(--bar-h)
}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:rgb(var(--accent-text))}

/* ---------- desktop: tabs move to the top ---------- */
@media (min-width:768px){
  nav{
    position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid rgba(var(--line),.12);
    justify-content:center;gap:10px;padding:0
  }
  nav button{flex:0 0 auto;flex-direction:row;gap:8px;font-size:var(--fs-small);padding:0 20px;height:58px}
  nav button svg{width:18px;height:18px}
  .wrap{padding-bottom:60px}
  .days{top:58px}
}
</style>
</head>
<body>

<nav id="nav">
  <button data-tab="home" class="on">
    <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5.5 9.5V20h13V9.5"/></svg>Home</button>
  <button data-tab="schedule">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M8 3v4M16 3v4M3 11h18"/></svg>Schedule</button>
  <button data-tab="links">
    <svg viewBox="0 0 24 24"><path d="M10 13a4 4 0 0 0 6 .5l2-2a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 11a4 4 0 0 0-6-.5l-2 2A4 4 0 0 0 11.7 18l1-1"/></svg>Links &amp; Info</button>
</nav>

<div class="wrap">

  <!-- ================= HOME ================= -->
  <section class="panel on" id="home">
    <div class="hero">
      <div class="mark"></div>
      <h1>Moroccan Nights<em>Lucy's 30th</em></h1>
      <div class="rule"></div>
      <div class="dates" id="h-dates"></div>
      <div class="countdown" id="h-count" style="margin-top:8px"></div>
    </div>

    <p id="h-intro1"></p>
    <p id="h-intro2"></p>

    <div class="facts" id="h-facts"></div>

    <h2 class="section-title">Before you go</h2>
    <div id="h-todo"></div>

    <h2 class="section-title">Theme Nights</h2>
    <div class="themes" id="h-themes"></div>
    <p class="small" id="h-foot" style="margin-top:22px"></p>
  </section>

  <!-- ================= SCHEDULE ================= -->
  <section class="panel" id="schedule">
    <p class="eyebrow" style="margin-top:22px">The Programme - In Progress</p>
    <div class="days" id="day-tabs"></div>
    <div id="tl-host"></div>
    <p class="small" id="s-foot"></p>
  </section>

  <!-- ================= LINKS & INFO ================= -->
  <section class="panel" id="links">
    <p class="eyebrow" style="margin-top:22px">Links &amp; Info</p>
    <div id="link-host"></div>
  </section>

</div>

<script>
/* ==========================================================================
   EVERYTHING EDITABLE LIVES HERE. Change text below, save, re-upload.
   Nothing under this block needs to be touched.
   ========================================================================== */
const DATA = {

  dates: "19 – 23 November 2026",
  countdownTo: "2026-11-19T00:00:00+01:00",   // Marrakech time

  home: {
    intro1: "Celebrate Lucy's thirtieth in style at palatial digs with broke grad student prices in Marrakech.",
    intro2: "Immeasurable gratitude for your consideration on this trip. If you’re invited, you have already made an impact on Lucy's very short life!!!",
    facts: [
      ["Where", "Route d'Ourika, Marrakesh, Marrakesh-Safi 40000"],
      ["Arrive", "Thu 19 Nov"],
      ["Depart", "Mon 23 Nov, after lunch"],
      ["Dress", "Two theme nights — Black & Gold + Morocco Maximalist"]
    ],
    /* third item is an optional link — leave it off for a plain, non-tappable row */
    todo: [
      ["RSVP on Partiful", "See the great people who will be joining us",
        "https://partiful.com/e/6Y8iZ2mX6NeD6N80tuIB"],
      ["Place your deposit", "$125 to Lucy",
        "https://account.venmo.com/u/lucyshen"],
      ["Join the WhatsApp", "Text Lucas or Lucy for an invite"],
      ["Book your flight", "RAK airport, 20 min from the Kasbah",
        "https://www.google.com/travel/flights?q=Flights%20to%20RAK%20on%202026-11-19%20through%202026-11-23"]
    ],
    /* style "bg" = black & gold typographic card · img = photo card */
    themes: [
      { day:"Fri 20 Nov", title:"Black &amp; Gold Night", note:"Mood board coming soon",
        url:"themes/black-gold/", style:"bg" },
      { day:"Sat 21 Nov", title:"Moroccan Maximalist", note:"Scroll the collage ›",
        url:"themes/maximalist/", img:"themes/maximalist/card.webp" }
    ],
    foot: "Site last updated 16 Sept."
  },

  /* tone: "" = normal · "night" = late-night highlight · "tent" = not confirmed */
  schedule: [
    { day:"Thu", date:"19 Nov", label:"Arrivals",
      events:[
        { t:"All day", title:"Arrivals & check-in", note:"Drop bags any time — mint tea on the roof" },
        { t:"7:00 PM", title:"Welcome Dinner", note:"7 – 9 PM · Courtyard, all together", tone:"night" },
        { t:"9:30 PM", title:"Rooftop nightcap", note:"Optional, low-key" }
      ]},
    { day:"Fri", date:"20 Nov", label:"Black & Gold",
      events:[
        { t:"8:00 AM", title:"Breakfast", note:"8 – 10 AM · Come when you wake up" },
        { t:"9:00 AM", title:"Yoga by the pool", note:"9 – 9:45 AM · Mats provided" },
        { t:"10:00 AM", title:"Town walk & souks", note:"10 AM – 12 PM · Guided, meet at the front door" },
        { t:"12:30 PM", title:"Lunch", note:"12:30 – 2 PM · Poolside, casual" },
        { t:"2:30 PM", title:"Dune buggies", note:"2:30 – 5 PM · Sign-up sheet in WhatsApp", tone:"tent" },
        { t:"2:30 PM", title:"Hammam & spa", note:"2:30 – 5 PM · The gentler option" },
        { t:"6:00 PM", title:"Intro Games", note:"6 – 7 PM · Nobody escapes this one" },
        { t:"7:00 PM", title:"Black and Gold Night", note:"7 – 9 PM · Dinner, dress the theme", tone:"night" },
        { t:"10:00 PM", title:"Dancing — Night One", note:"10 PM – late · DJ TBC", tone:"night" }
      ]},
    { day:"Sat", date:"21 Nov", label:"The Big One",
      events:[
        { t:"8:00 AM", title:"Breakfast", note:"8 – 10 AM" },
        { t:"9:00 AM", title:"Yoga by the pool", note:"9 – 9:45 AM" },
        { t:"10:00 AM", title:"Free morning", note:"Pool, market run, or nothing at all" },
        { t:"12:30 PM", title:"Lunch", note:"12:30 – 2 PM" },
        { t:"2:00 PM", title:"Group photo", note:"2 PM sharp · Wear something you like" },
        { t:"7:00 PM", title:"Maximal Marrakesh", note:"7 – 9 PM · The big dinner, maximum colour", tone:"night" },
        { t:"9:00 PM", title:"Presentation & toasts", note:"9 – 10 PM · Fire throwers, speeches, cake", tone:"night" },
        { t:"10:00 PM", title:"Dancing — Night Two", note:"10 PM – late · DJ TBC", tone:"night" }
      ]},
    { day:"Sun", date:"22 Nov", label:"Souks & Sundown",
      events:[
        { t:"8:00 AM", title:"Breakfast", note:"8 – 10 AM" },
        { t:"9:00 AM", title:"Yoga by the pool", note:"9 – 9:45 AM" },
        { t:"10:30 AM", title:"Agafay desert excursion", note:"10:30 AM – 2 PM · Optional, sign up in WhatsApp", tone:"tent" },
        { t:"12:30 PM", title:"Lunch", note:"12:30 – 2 PM · Poolside for anyone staying back" },
        { t:"3:00 PM", title:"Free afternoon", note:"Pool, hammam, or one last run at the souks" },
        { t:"7:00 PM", title:"Long table dinner", note:"7 – 9 PM · Last proper dinner, all together", tone:"night" },
        { t:"9:30 PM", title:"Dancing — Night Three", note:"9:30 PM – late · Wind-down set", tone:"night" }
      ]},
    { day:"Mon", date:"23 Nov", label:"Departures",
      events:[
        { t:"8:00 AM", title:"Breakfast", note:"8 – 10 AM" },
        { t:"12:30 PM", title:"Check-out lunch & farewells", note:"12:30 – 2:30 PM · Bags to the lobby first" },
        { t:"3:00 PM", title:"Airport transfers", note:"Rolling — tell us your flight time" }
      ]}
  ],
  scheduleFoot: "All times Marrakech local (GMT+1).",

  links: [
    { head:"Coordinate" },
    { t:"Partiful event", d:"RSVP and see who's coming",
      url:"https://partiful.com/e/6Y8iZ2mX6NeD6N80tuIB" },
    { t:"Trip calendar", d:"Subscribe — updates automatically",
      url:"webcal://calendar.google.com/calendar/ical/aa85465838dde2316f798e57d5aa7578f5af0ce5672abc79ef731f43cccb0fe2%40group.calendar.google.com/public/basic.ics" },
    { t:"Shared photo album", d:"Everyone's photos in one place", url:"https://photos.app.goo.gl/RK5ZJXMEhtcmDA1T9" },

    { head:"Getting there" },
    { t:"Google Maps", d:"List of Key places",
      url:"https://maps.app.goo.gl/rWRafSthC2X1MkRc9" },
    { t:"The Airbnb", d:"Rock the Kasbah", url:"https://www.airbnb.com/rooms/39713727?" },
    { t:"Airport Coordination", d:"Send us your flight times so we can coordinate pickups / drop-offs", url:"#" },

    { head:"Good to know" },
    { t:"Packing list & logistics", d:"Just our recommendations", url:"#" },
    { t:"Black & Gold Moodboard", d:"Fri 20 Nov · Mood board coming soon", url:"themes/black-gold/" },
    { t:"Moroccan Maximalist Moodboard", d:"Sat 21 Nov · Scroll the collage", url:"themes/maximalist/" },
    { t:"Weather & what to expect", d:"Warm days, cold nights", url:"#" }
  ]
};

/* ---------- render (no need to edit below) ---------- */
const $ = s => document.querySelector(s);

$("#h-dates").textContent = DATA.dates;
$("#h-intro1").textContent = DATA.home.intro1;
$("#h-intro2").textContent = DATA.home.intro2;
$("#h-foot").textContent = DATA.home.foot;
$("#s-foot").textContent = DATA.scheduleFoot;

const d = Math.ceil((new Date(DATA.countdownTo) - new Date())/864e5);
$("#h-count").textContent = d > 0 ? d + " days to go" : (d === 0 ? "Today" : "");

$("#h-facts").innerHTML = DATA.home.facts
  .map(([k,v]) => `<div class="fact"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

$("#h-todo").innerHTML = DATA.home.todo.map(([t,dd,url],i) => {
  const inner = `<div class="num">${String(i+1).padStart(2,"0")}</div>
      <div><div class="t">${t}</div><div class="d">${dd}</div></div>`;
  return url
    ? `<a class="link" href="${url}" target="_blank" rel="noopener nofollow">${inner}<div class="ar">›</div></a>`
    : `<div class="link">${inner}</div>`;
}).join("");

$("#h-themes").innerHTML = DATA.home.themes.map(t => `
  <a class="theme ${t.img ? "photo" : t.style||""}" href="${t.url}">
    ${t.img ? `<img src="${t.img}" alt="" width="360" height="480" loading="lazy" decoding="async">` : ""}
    <div class="in"><div class="k">${t.day}</div><h3>${t.title}</h3><div class="d">${t.note}</div></div>
  </a>`).join("");

/* on-site pages (no "scheme:") open in the same tab; everything else in a new one */
const ext = url => /^[a-z]+:/i.test(url) ? ' target="_blank" rel="noopener nofollow"' : "";
$("#link-host").innerHTML = DATA.links.map(l =>
  l.head
    ? `<h2 class="section-title">${l.head}</h2>`
    : `<a class="link" href="${l.url}"${ext(l.url)}>
         <div><div class="t">${l.t}</div><div class="d">${l.d}</div></div>
         <div class="ar">›</div></a>`
).join("");

const dayTabs = $("#day-tabs"), tlHost = $("#tl-host");
dayTabs.innerHTML = DATA.schedule.map((s,i) =>
  `<button class="day-btn${i===0?" on":""}" data-i="${i}"><b>${s.day}</b>${s.date}</button>`).join("");

function drawDay(i){
  const s = DATA.schedule[i];
  tlHost.innerHTML =
    `<p class="eyebrow" style="margin:6px 0 12px">${s.label}</p><div class="tl">` +
    s.events.map(e => `
      <div class="ev ${e.tone||""}">
        <div class="time">${e.t}</div>
        ${e.tone==="tent" ? '<span class="tag">To confirm</span><br>' : ""}
        <h3>${e.title}</h3>
        <div class="note">${e.note||""}</div>
      </div>`).join("") + `</div>`;
  dayTabs.querySelectorAll(".day-btn").forEach((b,j)=>b.classList.toggle("on", j===i));
}
dayTabs.addEventListener("click", e => {
  const b = e.target.closest(".day-btn"); if(b) drawDay(+b.dataset.i);
});
drawDay(0);

function show(tab){
  document.querySelectorAll(".panel").forEach(p => p.classList.toggle("on", p.id===tab));
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab===tab));
  if(location.hash.slice(1) !== tab) history.replaceState(null,"","#"+tab);
  window.scrollTo(0,0);
}
$("#nav").addEventListener("click", e => {
  const b = e.target.closest("button"); if(b) show(b.dataset.tab);
});
if(["home","schedule","links"].includes(location.hash.slice(1))) show(location.hash.slice(1));
</script>
</body>
</html>
