<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Black &amp; Gold Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Instrument+Sans:wght@400;500&display=swap">
<style>
  /* PLACEHOLDER. When the poster + cutouts exist, rebuild this page from
     /themes/maximalist/index.html (same scroll engine, swap assets + palette). */
  :root {
    --ink: #0b0a08;
    --gold: #c9a24a;       /* gold leaf */
    --paper: #f3e7c9;      /* warm cream text */
    --rule: rgba(201, 162, 74, .45);
    --display: "Syncopate", "Arial Black", "Helvetica Neue", sans-serif;
    --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { margin: 0; overflow-x: clip; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: grid; place-items: center;
    background:
      repeating-linear-gradient(90deg, var(--ink) 0 48px, #14110b 48px 96px);
    color: var(--paper);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
    padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px))
             max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    box-sizing: border-box;
  }
  .card {
    display: grid; gap: 18px; justify-items: center; text-align: center;
    max-width: 34rem; padding: 48px 28px;
    background: var(--ink); border: 1px solid var(--rule);
  }
  .eyebrow {
    font: 700 11px/1.4 var(--display); letter-spacing: .3em; text-transform: uppercase;
    color: var(--gold);
  }
  h1 {
    margin: 0; font: 700 clamp(30px, 9vw, 60px)/1.02 var(--display);
    letter-spacing: -.01em; text-transform: uppercase; text-wrap: balance;
    color: var(--gold);
  }
  p { margin: 0; font-size: 17px; line-height: 1.55; opacity: .85; text-wrap: pretty; }
  a {
    margin-top: 8px; color: var(--paper); text-decoration: none;
    font: 700 10px/1 var(--display); letter-spacing: .28em; text-transform: uppercase;
    padding: 12px 18px; border: 1px solid var(--rule); border-radius: 999px;
  }
  a:hover { background: rgba(201, 162, 74, .12); }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Theme night · Marrakech</div>
    <h1>Black &amp; Gold Night</h1>
    <p>The mood board is on its way. For now: black tie, gold everything.</p>
    <a href="../../">Back to the trip site</a>
  </main>
</body>
</html>
