<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Moroccan Maximalist Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&display=swap">
<style>
  /* Layout: the poster is pinned behind everything; a tall scroll track carries
     cutout "stickers" that slide in from the left and right and settle over it.
     Phone: poster fills the screen with a slight zoom. Laptop: poster spans the full width. Either way it pans down as you scroll and fades under a paper wash. */
  /* Palette and fonts match the main site's paper look (/index.html :root) — keep in sync. */
  :root {
    --bg: #F1E6D2;           /* paper: page background */
    --surface: #F8F2E6;      /* lighter paper: closing card, scroll cue */
    --wash: 241, 230, 210;   /* rgb of the paper wash that fades the poster */
    --ink: #23204A;          /* indigo ink: text */
    --muted: #655D70;
    --line: 35, 32, 74;      /* rgb of hairlines (ink) */
    --accent-text: #8A5A0C;  /* ochre: gold for text on paper */
    --shadow: 42, 26, 18;    /* rgb of the warm umber cutout shadow */
    --display: "Gloock", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --u: 100vw;            /* sizing unit for cutouts: screen width on phones */
    --row: 56vh;
    color-scheme: light;
  }
  @supports (height: 1svh) { :root { --row: 56svh; } }
  @media (min-aspect-ratio: 3/4) {
    :root { --u: 62vh; --row: 72vh; }
  }

  html { scroll-behavior: smooth; }
  html, body { overflow-x: clip; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--body);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- pinned poster ---------- */
  .stage { position: fixed; inset: 0; z-index: 0; overflow: hidden; background: var(--bg); }
  .stage img { position: absolute; display: block; max-width: none; }
  /* The poster is at least as wide as the window (laptop: full-bleed, much taller than the
     screen) and at least --overscan × the screen height (phone: a slight zoom), then pans
     upward as you scroll (--pan, set in JS) so you travel down the whole poster. */
  .stage {
    --overscan: 1.25;
    --vh: 100vh;
  }
  @supports (height: 1svh) { .stage { --vh: 100svh; } }
  .stage .sharp {
    top: 0; left: 50%;
    width: max(100vw, calc(var(--vh) * var(--overscan) * 941 / 1672)); height: auto;
    transform: translate3d(-50%, var(--pan, 0px), 0);
    will-change: transform;
  }
  .stage .shade {
    position: absolute; inset: 0;
    background: rgba(var(--wash), var(--dim, 0));
  }

  /* ---------- scroll cue ---------- */
  .cue {
    position: fixed; z-index: 5; left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 22px);
    transform: translateX(-50%);
    display: flex; align-items: center; gap: 10px;
    padding: 9px 16px 9px 18px; border-radius: 999px;
    background: rgba(248, 242, 230, .9); color: var(--ink);
    border: 1px solid rgba(var(--line), .15);
    font: 600 11px/1 var(--body); letter-spacing: .18em; text-transform: uppercase;
    pointer-events: none; opacity: var(--cue, 1);
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .cue svg { width: 12px; height: 12px; animation: nudge 1.6s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(4px); } }

  /* ---------- scroll track ---------- */
  .track {
    position: relative; z-index: 1;
    width: 100%;   /* full window width, so cutouts spread to the edges on desktop */
    padding-top: 94vh;
    overflow-x: clip;
  }
  .row { position: relative; height: var(--row); }
  .cut {
    --w: calc(var(--s) * var(--u));
    --x: var(--xp);
    position: absolute; top: var(--tp, 0%);
    left: calc(var(--x) - var(--w) / 2);
    width: var(--w);
    z-index: 2;
    will-change: transform;
    transform: rotate(var(--r));
  }
  .cut.tile { z-index: 1; }
  .cut img {
    display: block; width: 100%; height: auto;
    filter: drop-shadow(0 10px 14px rgba(var(--shadow), .4));
  }
  @media (min-aspect-ratio: 3/4) {
    .cut { --x: var(--xd); top: var(--td, 0%); }
  }

  /* ---------- closing card ---------- */
  .end {
    position: relative; z-index: 3;
    min-height: 90vh;
    display: grid; place-items: center;
    padding-block: 12vh 16vh;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    text-align: center;
  }
  .end .inner {
    display: grid; gap: 18px; justify-items: center; max-width: 34rem;
    padding: 40px 26px; border-radius: 22px;
    background: var(--surface); border: 1px solid rgba(var(--line), .12);
    box-shadow: 0 10px 40px rgba(var(--shadow), .18);
  }
  .eyebrow {
    font: 600 11px/1.4 var(--body); letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent-text);
  }
  .end h2 {
    margin: 0; font: 400 clamp(38px, 11vw, 72px)/1.02 var(--display); font-synthesis: none;
    letter-spacing: -.01em; text-wrap: balance;
    color: var(--ink);
  }
  .end p { margin: 0; font-size: 17px; line-height: 1.55; color: var(--muted); text-wrap: pretty; }
  .end a {
    margin-top: 8px; color: var(--ink); text-decoration: none;
    font: 600 11px/1 var(--body); letter-spacing: .16em; text-transform: uppercase;
    padding: 13px 18px; border: 1px solid rgba(var(--line), .25); border-radius: 999px;
  }
  .end a:hover { background: rgba(var(--line), .06); }
  .end a:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .cue svg { animation: none; }
  }
</style>

</head>
<body>
<div class="stage" aria-hidden="true">
  <img class="sharp" src="poster.webp" alt="" width="941" height="1672" fetchpriority="high">
  <div class="shade"></div>
</div>

<div class="cue" aria-hidden="true">
  Scroll
  <svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 4l4 4 4-4"/></svg>
</div>

<main id="top">
  <div class="track" id="track"></div>

  <section class="end">
    <div class="inner">
      <div class="eyebrow">Theme night · Marrakech</div>
      <h2>More is more</h2>
      <p>Pattern on pattern, jewel tones, brass and gold. Clash it on purpose.</p>
      <a href="#top">Back to the poster</a>
      <a href="../../">Back to the trip site</a>
    </div>
  </section>
</main>

<script>
(() => {
  // [file, side (-1 left / 1 right), scale, phone x%, laptop x%, phone top, laptop top, resting rotation, w, h]
  const P = (f, side, s, xp, xd, r, w, h) => ({ f, side, s, xp, xd, r, w, h, tile: false });
  const T = (f, side, s, xp, xd, tp, td, r, w, h) => ({ f, side, s, xp, xd, tp, td, r, w, h, tile: true });
  const rows = [
    [T('p17', -1, .34, 20, 10, 40, 34, -6, 223, 181), P('p00',  1, .82, 58, 74,  3, 517, 495)],
    [P('p01', -1, .50, 30, 26, -3, 272, 482), T('p09',  1, .36, 80, 90, 30, 22,  8, 191, 177)],
    [P('p03',  1, .72, 62, 74,  2, 419, 497), T('p11', -1, .32, 16, 10, 52, 40, -10, 163, 171)],
    [P('p04', -1, .40, 27, 27, -2, 211, 478), T('p10',  1, .36, 76, 88, 22, 18,  5, 163, 178)],
    [P('p05',  1, .90, 55, 72, -2, 560, 346), T('p13', -1, .34, 18, 11, 58, 42,  7, 196, 170)],
    [P('p07', -1, .44, 28, 27,  3, 188, 344), T('p12',  1, .32, 78, 89, 36, 26, -12, 165, 163)],
    [P('p06',  1, .74, 60, 74, -3, 415, 358), T('p15', -1, .34, 18, 11, 54, 40,  6, 183, 171)],
    [P('p02', -1, .52, 32, 26,  2, 279, 508), T('p16',  1, .36, 80, 89, 42, 30, -5, 174, 158)],
    [P('p08',  1, .78, 58, 73, -2, 433, 407), T('p14', -1, .24, 16, 12, 30, 24,  9, 105, 149)],
  ];

  const track = document.getElementById('track');
  const cuts = [];
  rows.forEach(list => {
    const row = document.createElement('div');
    row.className = 'row';
    list.forEach(d => {
      const el = document.createElement('div');
      el.className = 'cut' + (d.tile ? ' tile' : '');
      el.style.cssText = `--s:${d.s};--xp:${d.xp}%;--xd:${d.xd}%;--r:${d.r}deg;` +
        (d.tile ? `--tp:${d.tp}%;--td:${d.td}%;` : '');
      const img = new Image(d.w, d.h);
      img.src = `el/${d.f}.webp`; img.alt = ''; img.decoding = 'async';
      el.appendChild(img);
      row.appendChild(el);
      cuts.push({ el, row, d });
    });
    track.appendChild(row);
  });

  const root = document.documentElement;
  const stageShade = document.querySelector('.stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');
  const poster = document.querySelector('.stage .sharp');
  let vw = 0, vh = 0, docH = 0, panMax = 0, panEnd = 1, ticking = false;

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const easeOut = t => 1 - Math.pow(1 - t, 3);

  function measure() {
    vw = innerWidth; vh = innerHeight;
    docH = document.documentElement.scrollHeight;
    const tr = track.getBoundingClientRect();
    const trTop = tr.top + scrollY;
    // poster reaches its bottom edge just as the collage ends and the closing card arrives
    panMax = Math.max(0, poster.offsetHeight - vh);
    panEnd = Math.max(1, trTop + track.offsetHeight - vh);
    cuts.forEach(c => {
      c.top = trTop + c.row.offsetTop + c.el.offsetTop;
      c.left = tr.left + c.el.offsetLeft;
      c.wpx = c.el.offsetWidth;
      c.hpx = c.el.offsetHeight;
    });
  }

  function frame() {
    ticking = false;
    const y = scrollY;
    // darken the poster as the collage builds, and more at the closing card
    const start = clamp(y / (vh * 0.9)) * 0.38;
    const end = clamp((y + vh - (docH - vh * 0.95)) / (vh * 0.7)) * 0.4;
    stageShade.style.setProperty('--dim', (start + end).toFixed(3));
    root.style.setProperty('--cue', clamp(1 - y / (vh * 0.15)).toFixed(3));
    const pan = reduce.matches ? 0 : -panMax * clamp(y / panEnd);
    stageShade.style.setProperty('--pan', pan.toFixed(1) + 'px');

    if (reduce.matches) return;
    cuts.forEach(c => {
      const topV = c.top - y;
      if (topV > vh + 40 && c.parked) return;
      if (topV + c.hpx < -vh && c.done) return;
      const d = c.d;
      // entry: starts when the piece's top reaches the bottom of the screen,
      // lands when it reaches ~38% (tiles lag slightly so they arrive second)
      const t = d.tile
        ? clamp((vh * 0.92 - topV) / (vh * 0.5))
        : clamp((vh - topV) / (vh * 0.62));
      const e = easeOut(t);
      const dist = d.side < 0 ? c.left + c.wpx + 40 : vw - c.left + 40;
      const tx = d.side * dist * (1 - e);
      const rot = d.r + d.side * (d.tile ? 34 : 22) * (1 - e);
      const sc = 0.88 + 0.12 * e;
      // after landing, drift up a little for depth
      const drift = clamp((vh * 0.38 - topV) / vh, 0, 1.6) * (d.tile ? 70 : 34);
      c.el.style.transform =
        `translate3d(${tx.toFixed(1)}px, ${(-drift).toFixed(1)}px, 0) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(3)})`;
      c.parked = t === 0;
      c.done = t === 1;
    });
  }

  function onScroll() { if (!ticking) { ticking = true; requestAnimationFrame(frame); } }
  function refresh() { measure(); cuts.forEach(c => { c.parked = c.done = false; }); frame(); }

  addEventListener('scroll', onScroll, { passive: true });
  addEventListener('resize', refresh);
  addEventListener('load', refresh);
  if (!poster.complete) poster.addEventListener('load', refresh);
  if (document.fonts) document.fonts.ready.then(refresh);
  reduce.addEventListener?.('change', () => {
    if (reduce.matches) cuts.forEach(c => { c.el.style.transform = ''; });
    refresh();
  });
  refresh();
})();
</script>
</body>
</html>
